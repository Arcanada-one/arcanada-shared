title = "arcanada-shared gitleaks configuration"

[extend]
useDefault = true

# The Agent-Brain observation package ships a synthetic, non-secret idempotency key as a fixture value.
[[allowlists]]
description = "Synthetic fixture idempotency key in the sha256-pinned observation package"
paths = ['''packages/observation-profile/test/fixtures/observation-profile-v1/fixture-records\.json''']
regexes = ['''fixture-idempotency-1''']
