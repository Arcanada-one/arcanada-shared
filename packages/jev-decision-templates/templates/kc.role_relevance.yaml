id: kc.role_relevance
version: 1
primitive: noul
instructions: >
  Decide whether the candidate role is necessary for the task in
  state.trusted.task_text. Candidates are supplied by the deterministic
  shortlist; this question is independent per role.
criteria:
  true: The role is necessary for the task.
  false: The role is not necessary for the task.
params_schema:
  type: object
  additionalProperties: false
  properties:
    role_id:
      type: string
      pattern: "^[a-z][a-z0-9_]{0,63}$"
  required:
    - role_id
state_schema_ref: kc
allow_non_ascii: []
