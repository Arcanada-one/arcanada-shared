packages:
  - packages/*

autoInstallPeers: true
publicHoistPattern:
  - "@types/*"
shamefullyHoist: false
strictPeerDependencies: false

catalog:
  "@changesets/cli": ^2.31.1
  "@nestjs/common": ^11.1.28
  "@nestjs/core": ^11.1.28
  "@types/node": ^22.10.2
  "@typescript-eslint/eslint-plugin": ^8.18.0
  "@typescript-eslint/parser": ^8.18.0
  eslint: ^10.8.1
  prettier: ^3.4.2
  reflect-metadata: ^0.2.2
  tsup: ^8.3.5
  typescript: ^5.7.2
  vitest: ^4.1.10
  yaml: ^2.9.0
  zod: ^4.4.3

dangerouslyAllowAllBuilds: true

# Each key is the advisory's own vulnerable range, so an override stops
# matching once the tree is clean and a revised advisory is visible as an
# audit failure rather than being silently masked by a stale pin.
overrides:
  "brace-expansion@>=4.0.0 <5.0.9": 5.0.9
  "esbuild@>=0.27.3 <0.28.1": 0.28.1
  "js-yaml@>=3.0.0 <3.15.1": 3.15.1
  "js-yaml@>=4.0.0 <4.3.1": 4.3.1
  "nanoid@<3.3.17": 3.3.17
  "postcss@<=8.5.17": 8.5.18
  "vite@<=6.4.2": 6.4.3
