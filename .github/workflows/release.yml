name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test

      - run: pnpm audit --audit-level=high

      - name: Prepare version patch or publish tarballs
        id: plan
        env:
          RELEASE_PLAN_DIR: ${{ runner.temp }}/release-plan
        run: node scripts/prepare-release-plan.mjs

      - name: Build checksum-bound release plan
        env:
          RELEASE_ARCHIVE: release-plan-${{ github.sha }}.tar.gz
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/$RELEASE_ARCHIVE" \
            -C "$RUNNER_TEMP/release-plan" .
          (
            cd "$RUNNER_TEMP"
            sha256sum "$RELEASE_ARCHIVE" > "$RELEASE_ARCHIVE.sha256"
          )

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-plan-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release-plan-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/release-plan-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          overwrite: false
          retention-days: 1

  version-pr:
    needs: prepare
    if: needs.prepare.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-plan-${{ github.sha }}
          path: ${{ runner.temp }}/release-artifact

      - name: Verify and restore version plan
        env:
          RELEASE_ARCHIVE: release-plan-${{ github.sha }}.tar.gz
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release-artifact"
          sha256sum --check "$RELEASE_ARCHIVE.sha256"
          tar -tzf "$RELEASE_ARCHIVE" > "$RUNNER_TEMP/release-plan-entries"
          if grep -Eq '(^/|(^|/)\.\.(/|$))' \
            "$RUNNER_TEMP/release-plan-entries"; then
            echo "Unsafe path in release-plan archive." >&2
            exit 1
          fi
          mkdir "$RUNNER_TEMP/release-plan"
          tar -xzf "$RELEASE_ARCHIVE" -C "$RUNNER_TEMP/release-plan"
          test "$(tr -d '\n' < "$RUNNER_TEMP/release-plan/mode")" = "version"

      - name: Open a fresh Version Packages pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: changeset-release/${{ github.sha }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin \
            "refs/heads/$RELEASE_BRANCH" >/dev/null 2>&1; then
            echo "Version branch already exists; refusing to rewrite it."
            exit 0
          fi

          git apply --index "$RUNNER_TEMP/release-plan/version.patch"
          git switch -c "$RELEASE_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Version Packages"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$RELEASE_BRANCH"

          new_pr_url="$(gh pr create \
            --base main \
            --head "$RELEASE_BRANCH" \
            --title "Version Packages" \
            --body-file "$RUNNER_TEMP/release-plan/pr-body.md")"
          new_pr_number="${new_pr_url##*/}"

          gh pr list \
            --state open \
            --base main \
            --json number,title,headRefName \
            --jq '.[] | select(.title == "Version Packages") | .number' \
            > "$RUNNER_TEMP/version-pr-numbers"
          while IFS= read -r pr_number; do
            if [ "$pr_number" != "$new_pr_number" ]; then
              gh pr close "$pr_number" \
                --comment "Superseded by #$new_pr_number after release hardening landed."
            fi
          done < "$RUNNER_TEMP/version-pr-numbers"

  publish:
    needs: prepare
    if: needs.prepare.outputs.mode == 'publish'
    runs-on: ubuntu-latest # npm Trusted Publishing requires a cloud-hosted runner
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      # Trusted Publishing requires Node >=22.14 and npm >=11.5.1.
      - name: Ensure npm supports trusted publishing
        run: npm install --global --ignore-scripts npm@11.18.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-plan-${{ github.sha }}
          path: ${{ runner.temp }}/release-artifact

      - name: Verify and restore publish plan
        env:
          RELEASE_ARCHIVE: release-plan-${{ github.sha }}.tar.gz
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release-artifact"
          sha256sum --check "$RELEASE_ARCHIVE.sha256"
          tar -tzf "$RELEASE_ARCHIVE" > "$RUNNER_TEMP/release-plan-entries"
          if grep -Eq '(^/|(^|/)\.\.(/|$))' \
            "$RUNNER_TEMP/release-plan-entries"; then
            echo "Unsafe path in release-plan archive." >&2
            exit 1
          fi
          mkdir "$RUNNER_TEMP/release-plan"
          tar -xzf "$RELEASE_ARCHIVE" -C "$RUNNER_TEMP/release-plan"
          test "$(tr -d '\n' < "$RUNNER_TEMP/release-plan/mode")" = "publish"

      - name: Publish only validated package tarballs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          jq -r \
            '.packages[] | [.name, .version, .file, .notesFile, .sha256] | @tsv' \
            "$RUNNER_TEMP/release-plan/publish-manifest.json" \
            > "$RUNNER_TEMP/publish-packages"

          while IFS=$'\t' read -r \
            package_name package_version package_path notes_path expected_sha; do
            case "$package_name" in
              "@arcanada/eslint-config" | \
              "@arcanada/logger" | \
              "@arcanada/nest-common" | \
              "@arcanada/tsconfig") ;;
              *)
                echo "Unexpected package in release plan: $package_name" >&2
                exit 1
                ;;
            esac

            case "$package_path" in
              packages/*.tgz)
                package_basename="${package_path#packages/}"
                case "$package_basename" in
                  */* | *..*)
                    echo "Unsafe package path in release plan: $package_path" >&2
                    exit 1
                    ;;
                esac
                ;;
              *)
                echo "Unsafe package path in release plan: $package_path" >&2
                exit 1
                ;;
            esac
            case "$notes_path" in
              notes/*.md)
                notes_basename="${notes_path#notes/}"
                case "$notes_basename" in
                  */* | *..*)
                    echo "Unsafe notes path in release plan: $notes_path" >&2
                    exit 1
                    ;;
                esac
                ;;
              *)
                echo "Unsafe notes path in release plan: $notes_path" >&2
                exit 1
                ;;
            esac

            package_file="$RUNNER_TEMP/release-plan/$package_path"
            notes_file="$RUNNER_TEMP/release-plan/$notes_path"
            actual_sha="$(sha256sum "$package_file" | cut -d ' ' -f 1)"
            test "$actual_sha" = "$expected_sha"

            packed_name="$(tar -xOf "$package_file" package/package.json \
              | jq -r .name)"
            packed_version="$(tar -xOf "$package_file" package/package.json \
              | jq -r .version)"
            test "$packed_name" = "$package_name"
            test "$packed_version" = "$package_version"

            tar -tzf "$package_file" > "$RUNNER_TEMP/package-entries"
            if grep -Eq '(^/|(^|/)\.\.(/|$))' \
              "$RUNNER_TEMP/package-entries"; then
              echo "Unsafe archive path in $package_name tarball." >&2
              exit 1
            fi
            scan_dir="$(mktemp -d "$RUNNER_TEMP/package-scan.XXXXXX")"
            tar -xzf "$package_file" -C "$scan_dir"
            if grep -aERq '\b(INFRA|WEB|DEV|DEVOPS|CONTENT|RESEARCH|AGENT|BENCH|MAINT|FIN|QA|SEC|QCK|TUNE|ROB|DATA|ARCA|CUBR|VERD|AUTH|BILL|CONV|MUN|TRANS|SUP|OVER|CONS|VOICE|LTM|SRCH|CONN|ARGA|EMAIL|ARAS|STATUS|ADSR|LEGAL|PUB|SPACE|SHARED|CTRL|WIKI|DISK)-[0-9]{4}\b' \
              "$scan_dir"; then
              echo "Internal task ID found in $package_name tarball." >&2
              exit 1
            fi

            npm publish "$package_file" --access public --provenance --ignore-scripts
            release_tag="$package_name@$package_version"
            gh release create "$release_tag" \
              --target "$GITHUB_SHA" \
              --title "$release_tag" \
              --notes-file "$notes_file"
          done < "$RUNNER_TEMP/publish-packages"
