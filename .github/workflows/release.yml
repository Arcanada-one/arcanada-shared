name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test

      - run: pnpm audit --audit-level=high

      - name: Build immutable release artifact
        env:
          RELEASE_ARCHIVE: release-build-${{ github.sha }}.tar.gz
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/$RELEASE_ARCHIVE" \
            packages/eslint-config/dist \
            packages/logger/dist \
            packages/nest-common/dist
          (
            cd "$RUNNER_TEMP"
            sha256sum "$RELEASE_ARCHIVE" > "$RELEASE_ARCHIVE.sha256"
          )

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release-build-${{ github.sha }}.tar.gz
            ${{ runner.temp }}/release-build-${{ github.sha }}.tar.gz.sha256
          if-no-files-found: error
          overwrite: false
          retention-days: 1

  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - name: Fail closed before first package publication
        run: node scripts/release-preflight.mjs

  release:
    needs: [verify, preflight]
    runs-on: ubuntu-latest # Trusted Publishing requires a cloud-hosted runner
    permissions:
      contents: write # create the Version PR / tags
      pull-requests: write # open the Version PR
      id-token: write # OIDC Trusted Publishing — npm provenance, no long-lived token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install release tooling without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Trusted Publishing requires Node >=22.14 and npm >=11.5.1.
      # Keep both versions exact so compatibility cannot drift between runs.
      - name: Ensure npm supports trusted publishing
        run: npm install --global --ignore-scripts npm@11.18.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-build-${{ github.sha }}
          path: ${{ runner.temp }}/release-artifact

      - name: Verify and restore release artifact
        env:
          RELEASE_ARCHIVE: release-build-${{ github.sha }}.tar.gz
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/release-artifact"
          sha256sum --check "$RELEASE_ARCHIVE.sha256"
          tar -xzf "$RELEASE_ARCHIVE" -C "$GITHUB_WORKSPACE"

      - name: Create Release PR or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
