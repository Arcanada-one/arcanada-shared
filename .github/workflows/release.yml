name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write # create the Version PR / tags
  pull-requests: write # open the Version PR
  id-token: write # OIDC Trusted Publishing — npm provenance, no long-lived token

jobs:
  release:
    runs-on: ubuntu-latest # Trusted Publishing requires a cloud-hosted runner
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # npm 11 supports Node 20; 11.5.1 is the Trusted Publishing floor.
      # Keep both versions exact: npm 12 requires Node 22.22.2 or newer.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.5.1

      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
