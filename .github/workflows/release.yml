name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the Version PR / tags
  pull-requests: write # open the Version PR
  id-token: write # OIDC Trusted Publishing — npm provenance, no long-lived token

jobs:
  release:
    runs-on: ubuntu-latest # Trusted Publishing requires a cloud-hosted runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Trusted Publishing requires Node >=22.14 and npm >=11.5.1.
      # Keep both versions exact so compatibility cannot drift between runs.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.18.0

      - name: Create Release PR or publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
