version: 2
updates:
  # `directories` (plural), not `directory`. With a single root entry Dependabot
  # ignores the workspace members' package.json files entirely, so this repo's
  # five published packages would never be scanned — a config that looks present
  # and updates nothing.
  - package-ecosystem: npm
    directories:
      - "/"
      - "/packages/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
      eslint-typescript:
        patterns:
          - "@typescript-eslint/*"
          - eslint
      tooling:
        patterns:
          - prettier
          - tsup
          - typescript
          - vitest
          - yaml
          - "@changesets/cli"
          - "@types/node"
      runtime-libs:
        patterns:
          - rate-limiter-flexible
          - ioredis
          - ioredis-mock
          - reflect-metadata
          - zod
          - openid-client
          - pino
          - pino-http
          - nestjs-pino
    ignore:
      # `@types/node` majors track the Node major they describe, so the types
      # must follow `engines.node` (>=22.14.0) — not npm's `latest`. A newer
      # major silently disables the CI typecheck gate: `@types/node@26`
      # declares `URLPattern` and `Float16Array` as available globals, so
      # `tsc --noEmit` accepts them and CI goes green, while Node 22.23.4 —
      # the version CI runs and the floor this package supports — throws
      # `ReferenceError` on both. Raise this deliberately when `engines.node`
      # moves, together with the CI `node-version` and the toolchain policy
      # test; do not let it ride in on a routine dependency bump.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Majors need a deliberate migration PR, not a weekly storm.
      - dependency-name: "@nestjs/common"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/throttler"
        update-types: ["version-update:semver-major"]
      - dependency-name: tsup
        update-types: ["version-update:semver-major"]
      - dependency-name: "@changesets/cli"
        update-types: ["version-update:semver-major"]
      # TypeScript majors (5 → 7) break prepare/build via tsup + rollup-plugin-dts
      # (`useCaseSensitiveFileNames` undefined). Keep catalog on the 5.x line until
      # tsup/rollup-plugin-dts are verified against the new compiler; do not let a
      # weekly tooling group PR pull a major through.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
